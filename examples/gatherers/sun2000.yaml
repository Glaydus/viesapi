    type: I32
    gain: 1000
    addr: 30079
    quantity: 2
  - name: qmaxAbsorbed  # Maximum reactive power (Qmax, absorbed from the power grid)
    type: I32
    gain: 1000
    addr: 30081
    quantity: 2
  - name: state1
    type: Bitfield16
    gain: 1
    addr: 32000
    quantity: 1
    bits:
      1: {on: "standby", off: ""}
      2: {on: "grid connected", off: ""}
      4: {on: "grid-connected normally", off: ""}
      8: {on: "grid connection with derating due to power rationing", off: ""}
      16: {on: "grid connection with derating due to internal causes of the solar inverter", off: ""}
      32: {on: "normal stop", off: ""}
      64: {on: "stop due to faults", off: ""}
      128: {on: "stop due to power rationing", off: ""}
      256: {on: "shutdown", off: ""}
      512: {on: "spot check", off: ""}
  - name: state2
    type: Bitfield16
    gain: 1
    addr: 32002
    quantity: 1
    bits:
      1: {on: "unlocked", off: "locked"}
      2: {on: "PV connected", off: "PV disconnected"}
      4: {on: "DSP data collection on", off: "DSP data collection off"}
  - name: state3
    type: Bitfield32
    gain: 1
    addr: 32003
    quantity: 2
    bits:
      1: {on: "off-grid", off: "on-grid"}
      2: {on: "off-grid switch enabled", off: "off-grid switch disabled"}
  - name: states
    type: Strs
    merge:
      - state1
      - state2
      - state3
  - name: alarm1
    type: Bitfield16
    gain: 1
    addr: 32008
    quantity: 1
    bits:
      1: {on: "High String Input Voltage", off: "", code: 2001}
      2: {on: "DC Arc Fault", off: "", code: 2002}
      4: {on: "String Reverse Connection", off: "", code: 2011}
      8: {on: "String Current Backfeed", off: "", code: 2012}
      16: {on: "Abnormal String Power", off: "", code: 2013}
      32: {on: "AFCI Self-Check Fail.", off: "", code: 2021}
      64: {on: "Phase Wire Short-Circuited to PE", off: "", code: 2031}
      128: {on: "Grid Loss", off: "", code: 2032}
      256: {on: "Grid Undervoltage", off: "", code: 2033}
      512: {on: "Grid Overvoltage", off: "", code: 2034}
      1024: {on: "Grid Volt. Imbalance", off: "", code: 2035}
      2048: {on: "Grid Overfrequency", off: "", code: 2036}
      4096: {on: "Grid Underfrequency", off: "", code: 2037}
      8192: {on: "Unstable Grid Frequency", off: "", code: 2038}
      16384: {on: "Output Overcurrent", off: "", code: 2039}
      32768: {on: "Output DC Component Overhigh", off: "", code: 2040}
  - name: alarm2
    type: Bitfield16
    gain: 1
    addr: 32009
    quantity: 1
    bits:
      1: {on: "Abnormal Residual Current", off: "", code: 2051}
      2: {on: "Abnormal Grounding", off: "", code: 2061}
      4: {on: "Low Insulation Resistance", off: "", code: 2062}
      8: {on: "Overtemperature", off: "", code: 2063}
      16: {on: "Device Fault", off: "", code: 2064}
      32: {on: "Upgrade Failed or Version Mismatch", off: "", code: 2065}
      64: {on: "License Expired", off: "", code: 2066}
      128: {on: "Faulty Monitoring Unit", off: "", code: 61440}
      256: {on: "Faulty Power Collector", off: "", code: 2067}
      512: {on: "Battery abnormal", off: "", code: 2068}
      1024: {on: "Active Islanding", off: "", code: 2070}
      2048: {on: "Passive Islanding", off: "", code: 2071}
      4096: {on: "Transient AC Overvoltage", off: "", code: 2072}
      8192: {on: "Peripheral port short circuit", off: "", code: 2075}
      16384: {on: "Churn output overload", off: "", code: 2077}
      32768: {on: "Abnormal PV module configuration", off: "", code: 2080}
  - name: alarm3
    type: Bitfield16
    gain: 1
    addr: 32010
    quantity: 1
    bits:
      1: {on: "Optimizer fault", off: "", code: 2081}
      2: {on: "Built-in PID operation abnormal", off: "", code: 2085}
      4: {on: "High input string voltage to ground.", off: "", code: 2014}
      8: {on: "External Fan Abnormal", off: "", code: 2086}
      16: {on: "Battery Reverse Connection", off: "", code: 2069}
      32: {on: "On-grid/Off-grid controller abnormal", off: "", code: 2082}
      64: {on: "PV String Loss", off: "", code: 2015}
      128: {on: "Internal Fan Abnormal", off: "", code: 2087}
      256: {on: "DC Protection Unit Abnormal", off: "", code: 2088}
      512: {on: "EL Unit Abnormal", off: "", code: 2089}
      1024: {on: "Active Adjustment Instruction Abnormal", off: "", code: 2090}
      2048: {on: "Reactive Adjustment Instruction Abnormal", off: "", code: 2091}
      4096: {on: "CT Wiring Abnormal", off: "", code: 2092}
      8192: {on: "DC Arc Fault(ADMC Alarm to be clear manually)", off: "", code: 2003}
  - name: alarms
    type: Strs
    merge:
      - alarm1
      - alarm2
      - alarm3
