# gain, addr, quantity: see Lumel meter documentation
# type (one of the following):
#
# U16                       // Unsigned integer (16 bits)
# U32                       // Unsigned integer (32 bits)
# I16                       // Signed integer (16 bits)
# I32                       // Signed integer (32 bits)
# Str                       // String
# Strs                      // array of strings
# Bytes                     // Bytes
# Bitfield16                // 16-bit data expressed by bit
# Bitfield32                // 32-bit data expressed by bit
---
registers:
  - name: modbusPort
    type: U16
    gain: 1
    addr: 4147
    quantity: 1
  - name: modelNameReaded
    type: U16
    gain: 1
    addr: 4401
    quantity: 1
  - name: bootloaderVersion
    type: U16
    gain: 100
    addr: 4402
    quantity: 1
  - name: programVersion
    type: U16
    gain: 100
    addr: 4403
    quantity: 1
