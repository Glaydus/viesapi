    merge:
      - sn76
      - sn54
      - sn32
      - sn10
  - name: status1
    type: Bytes
    gain: 1
    addr: 4415
    quantity: 1
    bits:
      1: {on: "FRAM memory corruption", off: ""}
      2: {on: "no input calibration", off: ""}
      16: {on: "error in configuration registers", off: ""}
      32: {on: "error in displayed pages registers", off: ""}
      64: {on: "error in configuration registers of programmable read-only register group", off: ""}
      128: {on: "error of energy values", off: ""}
      256: {on: "error of phase sequence", off: ""}
      512: {on: "error in MQTT registries", off: ""}
      1024: {on: "error in the supervisory relay registers", off: ""}
      8192: {on: "presence of Ethernet and internal memory", off: ""}
      16384: {on: "used battery of RTC", off: ""}
  - name: status2
    type: Bytes
    gain: 1
    addr: 4416
    quantity: 1
    bits:
      1: {on: "signaling of condition 3 occurrence for alarm 2", off: ""}
      2: {on: "signaling of condition 2 occurrence for alarm 2", off: ""}
      4: {on: "signaling of condition 1 occurrence for alarm 2", off: ""}
      8: {on: "signaling of alarm 2 occurrence", off: ""}
      16: {on: "alarm 2 condition 3 active", off: ""}
      32: {on: "alarm 2 condition 2 active", off: ""}
      64: {on: "alarm 2 condition 1 active", off: ""}
      128: {on: "alarm 2 active", off: ""}
      256: {on: "signaling of condition 3 occurrence for alarm 1", off: ""}
      512: {on: "signaling of condition 2 occurrence for alarm 1", off: ""}
      1024: {on: "signaling of condition 1 occurrence for alarm 1", off: ""}
      2048: {on: "signaling of alarm 1 occurrence", off: ""}
      4096: {on: "alarm 1 condition 3 active", off: ""}
      8192: {on: "alarm 1 condition 2 active", off: ""}
      16384: {on: "alarm 1 condition 1 active", off: ""}
      32768: {on: "alarm 1 active", off: ""}
  - name: status3
    type: Bytes
    gain: 1
    addr: 4417
    quantity: 1
    bits:
      1: {on: "Ethernet connected", off: ""}
      16: {on: "archiving in 2-nd archiving group", off: "waiting until archiving conditions are met"}
      32: {on: "archiving in 1-st archiving group", off: "waiting until archiving conditions are met"}
      128: {on: "Archiving group 2 enabled", off: ""}
      256: {on: "Archiving group 1 enabled", off: ""}
      512: {on: "copying internal memory to file archive from 2nd archiving group", off: ""}
      2048: {on: "copying internal memory to file archive from 1st archiving group", off: ""}
      4096: {on: "File archive full, ( less than 14 days to complete archive filling at 1 sec. interval )", off: ""}
      8192: {on: "File archive used in 70%", off: ""}
      16384: {on: "File archive properly initiated", off: ""}
      32768: {on: "Error of file archive system", off: ""}
  - name: status4
    type: Bytes
    gain: 1
    addr: 4418
    quantity: 1
    bits:
      2: {on: "Demand- capacity 3L max.", off: ""}
      4: {on: "Demand- capacity 3L min.", off: ""}
      8: {on: "Demand- capacity 3L", off: ""}
      16: {on: "capacitive 3L maximum", off: ""}
      32: {on: "capacitive 3L minimum", off: ""}
      64: {on: "capacitive 3L", off: ""}
      128: {on: "capacitive L3 maximum", off: ""}
      2048: {on: "capacitive L3 minimum", off: ""}
      1024: {on: "capacitive L3", off: ""}
      512: {on: "capacitive L2 maximum", off: ""}
      256: {on: "capacitive L2 minimum", off: ""}
      4096: {on: "capacitive L2", off: ""}
      8192: {on: "capacitive L1 maximum", off: ""}
      16384: {on: "capacitive L1 minimum", off: ""}
      32768: {on: "capacitive L1", off: ""}
  - name: status5
    type: Bytes
    gain: 1
    addr: 4419
    quantity: 1
    bits:
      128: {on: "alarm 1, condition 3 for L3 phase active", off: ""}
      256: {on: "alarm 1, condition 3 for L2 phase active", off: ""}
      512: {on: "alarm 1, condition 3 for L1 phase active", off: ""}
      1024: {on: "alarm 1, condition 2 for L3 phase active", off: ""}
      2048: {on: "alarm 1, condition 2 for L2 phase active", off: ""}
      4096: {on: "alarm 1, condition 2 for L1 phase active", off: ""}
      8192: {on: "alarm 1, condition 1 for L3 phase active", off: ""}
