# Device-specific fields:
# driver: driver name (required for inverters and meters)
#
# port: modbus port number (optional) - defaults to 502
# slave: modbus slave id (optional) - defaults to 1
# timeout: read/write timeout (optional) - defaults to 2s
# register: modbus base register address (optional)
---
devices:
    # ASUS thinkerboard
    - marker: m1
      kind: os
      name: PC Host
      ip: 127.0.0.1
      sn: os

    # router
    - marker: m2
      kind: router
      name: Router
      ip: 192.168.88.1
      sn: router

    # plcs
    - marker: m3
      kind: plc
      name: FBs-20MCJ2-AC
      sn: Fatek-PLC
      ip: 192.168.88.250

    # meters
    - marker: m4
      kind: meter
      name: Lumel NR30
      driver: lumel
      sn: 00:00:00:00:01:4F:FF:A2

    # inverters
    - marker: m5
      kind: inverter
      name: SUN2000-3KTL-M1
      driver: sun2000
      sn: HV2140057957

    # smart
    - marker: m6
      kind: smart
      name: Smart Logger 3000
      sn: SmartLogger
      slave: 100

defrosting:
    - markers: [m0]
      duration: 2m
