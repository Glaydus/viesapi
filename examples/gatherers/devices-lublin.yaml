# Device-specific fields:
# driver: driver name (required for inverters and meters)
#
# port: modbus port number (optional) - defaults to 502
# slave: modbus slave id (optional) - defaults to 1
# timeout: read/write timeout (optional) - defaults to 2s
# register: modbus base register address (optional)
---
devices:
    # ASUS thinkerboard
    - marker: m1
      kind: os
      name: PC Host
      ip: 127.0.0.1
      sn: os

    # router
    - marker: m2
      kind: router
      name: Router
      ip: 10.72.31.1
      sn: router

    # smartlogger
    - marker: m6
      kind: smart
      name: Smart Logger 3000A
      ip: 10.72.31.105
      sn: SmartLogger
      slave: 10

    # smartlogger inverters
    - marker: m11
      kind: falownik
      name: Wiata-S5
      register: 51000
      sn: 6T2199042348
    - marker: m12
      kind: falownik
      name: Wiata-A1
      register: 51275
      sn: 6T2239005481
    - marker: m13
      kind: falownik
      name: Budynek-13
      register: 51300
      sn: 6T2199042126
    - marker: m14
      kind: falownik
      name: Budynek-12
      register: 51325
      sn: ES2230027654
    - marker: m15
      kind: falownik
      name: Wiata-S4
      register: 51350
      sn: 6T2199042324
    - marker: m16
      kind: falownik
      name: Wiata-S2
      register: 51375
      sn: 6T2199042143
    - marker: m17
      kind: falownik
      name: Wiata-G1
      register: 51400
      sn: 6T2199044626
    - marker: m18
      kind: falownik
      name: Wiata-G3
      register: 51425
      sn: ES2230027658
    - marker: m19
      kind: falownik
      name: Wiata-G2
      register: 51450
      sn: 6T2199044628
    - marker: m20
      kind: falownik
      name: Wiata-A2
      register: 51475
      sn: 6T2239004686
    - marker: m21
      kind: falownik
      name: Wiata-S1
      register: 51500
      sn: 6T2199043594
    - marker: m22
      kind: falownik
      name: Wiata-S3
      register: 51525
      sn: 6T2199044570
    - marker: m30
      kind: falownik
      name: Wiata-A3
      register: 51725
      sn: 6T21B9042212

    # plcs
    - marker: m31
      kind: plc
      name: FATEK-Wiata-A
      ip: 10.72.31.111
      sn: Fatek-PLC
    - marker: m32
      kind: plc
      name: FATEK-Wiata-D
      ip: 10.72.31.112
      sn: Fatek-PLC
    - marker: m33
      kind: plc
      name: FATEK-Wiata-G
      ip: 10.72.31.113
      sn: Fatek-PLC
    - marker: m34
      kind: plc
      name: FATEK-Dach
      ip: 10.72.31.114
      sn: Fatek-PLC

defrosting:
    - plc: m31
      duration: 1m
      markers: [m0,m1,m2,m3,m4,m5,m6,m7,m8,m9,m10,m11]
    - plc: m32
      duration: 1m
      markers: [m0,m1,m2,m3,m4,m5,m6,m7,m8,m9,m10,m11,m12,m13,m14,m15,m16,m17,m18,m19,m20,m21,m22,m23]
    - plc: m33
      duration: 1m
      markers: [m0,m1,m2,m3,m4,m5,m6,m7,m8,m9,m10,m11,m12,m13]
    - plc: m34
      duration: 1m
      markers: [m0,m1,m2,m3,m4,m5,m6,m7,m8]

lighting:
    - plc: m31
      markers: [m14]
    - plc: m32
      markers: [m28]
    - plc: m33
      markers: [m14]
